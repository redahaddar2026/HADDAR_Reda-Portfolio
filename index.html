<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reda Haddar | Embedded Systems · AI · XR/VR</title>
<meta name="description" content="Portfolio de Reda Haddar, ingénieur systèmes embarqués, IA & machine learning, XR/VR et jumeaux numériques.">
<meta property="og:title" content="Reda Haddar | Embedded Systems · AI · XR/VR">
<meta property="og:description" content="Digital twins, VR/AR experiences, embedded AI. Portfolio of Reda Haddar.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#05060A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060A; --bg2:#0a0d18; --panel:rgba(13,18,34,.66); --line:rgba(0,229,255,.22); --line2:rgba(124,58,237,.35);
  --cy:#00E5FF; --vi:#7C3AED; --mg:#FF3DCB; --tx:#E8ECF6; --mut:#8F98B2;
  --display:'Space Grotesk','Segoe UI',system-ui,sans-serif; --body:'Inter','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--body);font-size:16px;line-height:1.65;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
section{padding:110px 0;position:relative}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;letter-spacing:-.01em}
h2{font-size:clamp(2rem,4.4vw,3.3rem);font-weight:500}
.sub{color:var(--mut);max-width:60ch;margin:14px 0 44px}
.grid-bg{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 78%)}

/* HUD panel */
.hud{position:relative;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:3px}
.hud::before,.hud::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;border:2px solid var(--cy);opacity:.9}
.hud::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.hud::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(#05060Aee,#05060A99);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,229,255,.12)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:var(--display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.logo i{width:30px;height:30px;border:1.5px solid var(--cy);display:grid;place-items:center;font-style:normal;font-size:.8rem;color:var(--cy);box-shadow:0 0 14px rgba(0,229,255,.35) inset}
.links{display:flex;gap:26px;font-size:.92rem;color:var(--mut)}
.links a:hover{color:var(--cy)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:3px;padding:2px}
.lang button{background:none;border:0;color:var(--mut);font:600 .78rem var(--body);padding:5px 10px;cursor:pointer;border-radius:2px}
.lang button[aria-pressed=true]{background:var(--cy);color:#001418}
@media(max-width:960px){.links{display:none}}

/* HERO */
#hero{min-height:100svh;padding:0;display:flex;align-items:center;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#05060A 8%,rgba(5,6,10,.72) 42%,rgba(5,6,10,0) 75%),linear-gradient(0deg,#05060A 0%,transparent 22%)}
.hero-in{position:relative;z-index:2;padding:120px 0 90px}
h1{font-size:clamp(3rem,9.5vw,7.2rem);font-weight:700;letter-spacing:-.025em;text-transform:none}
h1 span{display:block}
.role{font-family:var(--display);font-size:clamp(1.1rem,2.3vw,1.6rem);color:var(--tx);margin:22px 0 10px;min-height:2.2em;display:flex;align-items:center;gap:10px}
.role::before{content:"";width:34px;height:2px;background:var(--cy);box-shadow:0 0 10px var(--cy);flex:none}
.tagline{color:var(--mut);max-width:50ch;margin:0 0 34px}
.btns{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;font:600 .95rem var(--body);border:1px solid var(--cy);color:var(--cy);background:rgba(0,229,255,.06);cursor:pointer;border-radius:3px;transition:transform .15s,background .2s,box-shadow .2s;will-change:transform}
.btn:hover{background:var(--cy);color:#001418;box-shadow:0 0 28px rgba(0,229,255,.45)}
.btn.solid{background:var(--cy);color:#001418}
.btn.solid:hover{background:#7DF3FF}
.btn.vr{border-color:var(--mg);color:var(--mg);background:rgba(255,61,203,.07)}
.btn.vr:hover{background:var(--mg);color:#1a0010;box-shadow:0 0 28px rgba(255,61,203,.45)}
.hud-meta{position:absolute;z-index:2;right:max(20px,calc((100vw - 1180px)/2));bottom:34px;font:500 .74rem var(--display);color:var(--mut);text-align:right;line-height:1.7;pointer-events:none}
.hud-meta b{color:var(--cy);font-weight:500}
.no-webgl #scene{display:none}
.no-webgl #hero{background:radial-gradient(circle at 70% 40%,rgba(124,58,237,.35),transparent 55%),radial-gradient(circle at 80% 70%,rgba(0,229,255,.22),transparent 50%),var(--bg)}
@media(max-width:900px){.hero-shade{background:linear-gradient(0deg,#05060A 12%,rgba(5,6,10,.55) 60%,rgba(5,6,10,.3))}.hud-meta{display:none}}

/* ABOUT */
.about{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:56px;align-items:center}
.holo{position:relative;padding:12px}
.holo .ph{position:relative;overflow:hidden;aspect-ratio:1/1.06}
.holo img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;filter:saturate(.85) contrast(1.05)}
.holo .ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,229,255,.09) 0 1px,transparent 1px 4px),linear-gradient(180deg,rgba(0,229,255,.18),transparent 30%,rgba(124,58,237,.22));mix-blend-mode:screen;pointer-events:none}
.holo .ph::before{content:"";position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,rgba(0,229,255,.35),transparent);z-index:2;animation:scan 5.5s linear infinite}
@keyframes scan{to{transform:translateY(520px)}}
.about p{color:#C6CCDD;max-width:62ch;font-size:1.06rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.stat{padding:16px 14px}
.stat b{display:block;font:500 2.3rem var(--display);color:var(--cy);line-height:1}
.stat span{font-size:.82rem;color:var(--mut)}
.langs{margin-top:26px;color:var(--mut);font-size:.95rem}
.langs b{color:var(--tx);font-weight:500}
@media(max-width:860px){.about{grid-template-columns:1fr;gap:34px}.stats{grid-template-columns:repeat(2,1fr)}}

/* PROJECTS */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px}
.filters button{background:transparent;border:1px solid var(--line);color:var(--mut);padding:8px 16px;font:500 .88rem var(--body);cursor:pointer;border-radius:999px;transition:.2s}
.filters button:hover{color:var(--tx);border-color:var(--cy)}
.filters button[aria-pressed=true]{background:var(--cy);border-color:var(--cy);color:#001418}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.card{cursor:pointer;transition:transform .25s ease,border-color .25s,box-shadow .25s;transform-style:preserve-3d;display:flex;flex-direction:column;overflow:hidden}
.card:hover{border-color:var(--cy);box-shadow:0 0 34px rgba(0,229,255,.16)}
.thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:
  radial-gradient(circle at 25% 20%,var(--h1,rgba(124,58,237,.5)),transparent 60%),radial-gradient(circle at 80% 90%,var(--h2,rgba(0,229,255,.35)),transparent 55%),#0a0e1c;border-bottom:1px solid var(--line)}
.thumb::before{content:"";position:absolute;inset:-40% -10% -10%;transform:perspective(300px) rotateX(62deg);background-image:linear-gradient(rgba(0,229,255,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.28) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(0deg,#000,transparent 80%);-webkit-mask-image:linear-gradient(0deg,#000,transparent 80%)}
.thumb video,.thumb .art{position:absolute;inset:0;width:100%;height:100%}
.thumb video{object-fit:cover;opacity:0;transition:opacity .3s;z-index:1}
.card:hover .thumb video.on{opacity:1}
.art{display:grid;place-items:center;color:var(--cy)}
.art svg{width:74px;height:74px;filter:drop-shadow(0 0 12px rgba(0,229,255,.7));transition:transform .5s}
.card:hover .art svg{transform:scale(1.12) rotate(-4deg)}
.badge{position:absolute;z-index:2;left:12px;top:12px;background:rgba(5,6,10,.78);border:1px solid var(--mg);color:#FFB3EC;font:500 .74rem var(--body);padding:4px 10px;border-radius:999px}
.cbody{padding:20px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.cbody h3{font-size:1.28rem;font-weight:500}
.cbody p{margin:0;color:var(--mut);font-size:.94rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tags span{font-size:.76rem;color:#B9C1D8;border:1px solid rgba(143,152,178,.3);padding:2px 9px;border-radius:999px}
.cs{color:var(--cy);font-weight:600;font-size:.9rem;margin-top:4px}
.card.hide{display:none}

/* cover images + AR corners */
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform .6s ease}
.card:hover .cover{transform:scale(1.06)}
.thumb.has-img::before{display:none}
.thumb::after{content:"";position:absolute;inset:10px;z-index:2;pointer-events:none;opacity:.85;
  background:
   linear-gradient(var(--cy),var(--cy)) top left/14px 2px no-repeat,linear-gradient(var(--cy),var(--cy)) top left/2px 14px no-repeat,
   linear-gradient(var(--cy),var(--cy)) top right/14px 2px no-repeat,linear-gradient(var(--cy),var(--cy)) top right/2px 14px no-repeat,
   linear-gradient(var(--cy),var(--cy)) bottom left/14px 2px no-repeat,linear-gradient(var(--cy),var(--cy)) bottom left/2px 14px no-repeat,
   linear-gradient(var(--cy),var(--cy)) bottom right/14px 2px no-repeat,linear-gradient(var(--cy),var(--cy)) bottom right/2px 14px no-repeat}
.thumb.has-img{background:#05060A}
.thumb.has-img .art{display:none}
.m-media img.cover{position:static;object-fit:contain;background:#05060A}
/* strip */
.strip{overflow:hidden;border-block:1px solid rgba(0,229,255,.14);background:rgba(8,11,22,.8);position:relative;z-index:3}
.strip-in{display:flex;width:max-content;animation:slide 46s linear infinite}
.strip-in span{display:flex;align-items:center;gap:12px;padding:16px 34px;color:var(--mut);font:500 .95rem var(--display);white-space:nowrap}
.strip-in svg{width:30px;height:30px;color:var(--cy);filter:drop-shadow(0 0 6px rgba(0,229,255,.6))}
@keyframes slide{to{transform:translateX(-50%)}}
/* MODAL */
.modal{position:fixed;inset:0;z-index:100;display:none;background:rgba(3,4,8,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) 20px 40px}
.modal.open{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.m-in{width:min(940px,100%);margin:40px auto;background:#080b16;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.m-media{aspect-ratio:16/8.5;position:relative;overflow:hidden}
.m-media video{width:100%;height:100%;object-fit:cover;background:#000}
.m-media .thumb{height:100%;aspect-ratio:auto}
.m-media .ph-note{position:absolute;left:0;right:0;bottom:16px;text-align:center;z-index:3;font-size:.82rem;color:var(--mut)}
.m-body{padding:30px 34px 36px}
.m-body h3{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:500;margin-bottom:6px}
.m-hook{color:var(--cy);margin:0 0 18px;font-family:var(--display)}
.m-body p{color:#C6CCDD;max-width:70ch}
.m-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:24px 0}
.m-meta h4{margin:0 0 6px;font:500 .8rem var(--body);color:var(--mut)}
.m-meta div>div{font-size:.95rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.gallery img{border:1px solid var(--line);aspect-ratio:16/10;object-fit:cover;width:100%}
.m-close{position:absolute;right:14px;top:14px;z-index:5;width:42px;height:42px;border:1px solid var(--line);background:rgba(5,6,10,.8);color:var(--tx);font-size:1.2rem;cursor:pointer;border-radius:3px}
.m-close:hover{border-color:var(--cy);color:var(--cy)}

/* TIMELINE */
.tl{position:relative;padding-left:38px;perspective:1100px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--cy),var(--vi),transparent)}
.tl-item{position:relative;margin-bottom:22px;padding:22px 26px;transition:transform .3s,border-color .3s;transform-origin:left center}
.tl-item:hover{transform:rotateY(-4deg) translateX(6px);border-color:var(--cy)}
.tl-item::marker{content:none}
.dot{position:absolute;left:-38px;top:24px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--cy);box-shadow:0 0 14px var(--cy)}
.dot::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--cy)}
.tl-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.tl-id{display:flex;align-items:center;gap:14px}
.mono{width:46px;height:46px;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(0,229,255,.18));display:grid;place-items:center;font:700 .92rem var(--display);flex:none;border-radius:3px}
.tl h3{font-size:1.2rem;font-weight:500}
.tl .org{color:var(--cy);font-size:.95rem}
.tl .when{color:var(--mut);font-size:.88rem;text-align:right}
.tl ul{margin:14px 0 0;padding-left:18px;color:#C0C7DA;font-size:.95rem}
.tl li{margin:5px 0}
.tl li::marker{color:var(--cy)}

/* EDUCATION */
.edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.edu .hud{padding:26px}
.edu h3{font-size:1.2rem;font-weight:500;margin:6px 0}
.edu .when{color:var(--cy);font-size:.88rem}
.edu .where{color:var(--mut);font-size:.92rem;margin-bottom:12px}
.edu p{margin:0;color:#C0C7DA;font-size:.95rem}
.pill{display:inline-block;margin-top:14px;border:1px solid var(--mg);color:#FFB3EC;font-size:.78rem;padding:3px 11px;border-radius:999px}

/* SKILLS */
.skills{display:grid;grid-template-columns:1.25fr 1fr;gap:34px;align-items:center}
.orbit{height:520px;padding:0;overflow:hidden}
#orbit{width:100%;height:100%;display:block}
.sk-list{display:grid;gap:14px}
.sk{padding:16px 18px}
.sk h3{font-size:1rem;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.sk h3 i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.sk div{display:flex;flex-wrap:wrap;gap:6px}
.sk span{font-size:.82rem;border:1px solid rgba(143,152,178,.3);padding:2px 10px;border-radius:999px;color:#C6CCDD}
@media(max-width:900px){.skills{grid-template-columns:1fr}.orbit{height:440px}}

/* CERTS & AWARDS */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.cert{padding:20px;display:flex;gap:14px;align-items:flex-start;transition:border-color .2s,transform .2s}
.cert:hover{border-color:var(--cy);transform:translateY(-3px)}
.hex{width:46px;height:52px;flex:none;background:linear-gradient(160deg,var(--vi),var(--cy));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;font:700 .72rem var(--display);color:#04121a}
.cert b{display:block;font-weight:500;font-size:.98rem;line-height:1.35}
.cert small{display:block;color:var(--mut);font-size:.82rem;margin-top:4px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.award{padding:28px}
.award h3{font-size:1.25rem;font-weight:500;margin-bottom:8px}
.award p{margin:0;color:#C0C7DA;font-size:.95rem}
.award .tr{font-size:1.6rem;margin-bottom:12px;color:var(--mg);font-family:var(--display)}

/* CONTACT */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.form{padding:28px;display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:.88rem;color:var(--mut)}
.form input,.form textarea{background:rgba(5,6,10,.7);border:1px solid var(--line);color:var(--tx);padding:12px 14px;font:inherit;border-radius:3px;width:100%}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
.form textarea{min-height:130px;resize:vertical}
.direct{display:grid;gap:14px;align-content:start}
.direct a{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;transition:.2s}
.direct a:hover{border-color:var(--cy);transform:translateX(6px)}
.direct small{color:var(--mut);display:block}
.direct b{font-weight:500}
@media(max-width:860px){.contact{grid-template-columns:1fr}}
footer{border-top:1px solid rgba(0,229,255,.12);padding:34px 0 48px;color:var(--mut);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}


/* ====== CURSOR ====== */
.cur-dot,.cur-ring,#trail{position:fixed;left:0;top:0;pointer-events:none;display:none}
#trail{width:100%;height:100%;z-index:198}
.cur-dot{width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--cy);box-shadow:0 0 14px var(--cy),0 0 32px rgba(0,229,255,.55);z-index:202}
.cur-ring{width:44px;height:44px;margin:-22px 0 0 -22px;border:1.5px solid rgba(0,229,255,.55);border-radius:50%;z-index:201;place-items:center;transition:width .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1),margin .3s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s}
.cur-ring span{font:600 .74rem var(--body);color:#001418;opacity:0;transition:opacity .2s;white-space:nowrap}
.cur-ring.hot{width:84px;height:84px;margin:-42px 0 0 -42px;background:var(--cy);border-color:var(--cy)}
.cur-ring.hot span{opacity:1}
.cur-ring.link{width:64px;height:64px;margin:-32px 0 0 -32px;border-color:var(--mg);background:rgba(255,61,203,.12)}
@media(hover:hover) and (pointer:fine){
  body.rt,body.rt *{cursor:none!important}
  body.rt .cur-dot,body.rt #trail{display:block}
  body.rt .cur-ring{display:grid}
}

/* ====== BOOT SCREEN ====== */
#boot{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;animation:bootsafe .01s 5.5s forwards}
#boot.out{clip-path:inset(0 0 100% 0);transition:clip-path 1s cubic-bezier(.7,0,.2,1)}
@keyframes bootsafe{to{visibility:hidden;pointer-events:none}}
.boot-in{display:grid;gap:22px;justify-items:center}
.boot-logo{width:76px;height:76px;border:2px solid var(--cy);display:grid;place-items:center;font:700 1.5rem var(--display);color:var(--cy);box-shadow:0 0 30px rgba(0,229,255,.45),inset 0 0 20px rgba(0,229,255,.25);animation:pulse 1.4s ease-in-out infinite;position:relative}
.boot-logo::before,.boot-logo::after{content:"";position:absolute;inset:-12px;border:1px solid rgba(124,58,237,.6);animation:spin 3.2s linear infinite}
.boot-logo::after{inset:-24px;border-color:rgba(255,61,203,.35);animation-duration:5s;animation-direction:reverse}
@keyframes pulse{50%{box-shadow:0 0 56px rgba(0,229,255,.8),inset 0 0 26px rgba(0,229,255,.4)}}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-bar{width:240px;height:2px;background:rgba(0,229,255,.15);margin-top:20px}
.boot-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--vi),var(--mg));box-shadow:0 0 12px var(--cy);transition:width .25s}
.boot-txt{font:500 .8rem var(--display);color:var(--mut);min-height:1.2em}

/* ====== PROGRESS + SIDE NAV + CUE ====== */
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--cy),var(--vi),var(--mg));box-shadow:0 0 12px var(--cy)}
#sidenav{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:16px}
#sidenav a{position:relative;display:block;width:12px;height:12px}
#sidenav a i{position:absolute;inset:1px;border:1.5px solid rgba(143,152,178,.6);border-radius:50%;transition:.3s}
#sidenav a.on i{background:var(--cy);border-color:var(--cy);box-shadow:0 0 12px var(--cy);transform:scale(1.3)}
#sidenav a span{position:absolute;right:24px;top:50%;transform:translateY(-50%) translateX(8px);opacity:0;white-space:nowrap;font:500 .78rem var(--body);background:rgba(5,6,10,.9);border:1px solid var(--line);padding:3px 10px;border-radius:3px;transition:.25s;pointer-events:none}
#sidenav a:hover span,#sidenav a:focus-visible span{opacity:1;transform:translateY(-50%)}
@media(max-width:1100px){#sidenav{display:none}}
.cue{position:absolute;left:50%;bottom:26px;z-index:2;width:24px;height:40px;border:1.5px solid rgba(0,229,255,.45);border-radius:14px;transform:translateX(-50%)}
.cue::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--cy);box-shadow:0 0 8px var(--cy);animation:cue 1.7s ease-in-out infinite}
@keyframes cue{0%{transform:translateY(0);opacity:1}80%,100%{transform:translateY(14px);opacity:0}}
@media(max-width:900px){.cue{display:none}}

/* ====== HERO ENTRANCE ====== */
h1 span{overflow:hidden;padding:0 .04em .12em}
h1 .l2{color:var(--cy)}
.ch{display:inline-block;font-style:normal;animation:chIn 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*60ms + .1s);animation-play-state:paused;will-change:transform}
@keyframes chIn{from{transform:translateY(108%) rotateX(-75deg);opacity:0;filter:blur(10px)}to{transform:none;opacity:1;filter:none}}
.hero-in .role,.hero-in .tagline,.hero-in .btns{animation:heroUp 1s cubic-bezier(.2,.8,.2,1) both;animation-play-state:paused}
.hero-in .role{animation-delay:.85s}.hero-in .tagline{animation-delay:1.05s}.hero-in .btns{animation-delay:1.25s}
@keyframes heroUp{from{opacity:0;transform:translateY(34px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
body.ready .hero-in *{animation-play-state:running}
.hud-meta{animation:heroUp 1s 1.6s both;animation-play-state:paused}
body.ready .hud-meta{animation-play-state:running}
#clk{color:var(--tx);font-variant-numeric:tabular-nums}

/* ====== REVEAL ON SCROLL ====== */
.rv{opacity:0}
.rv.in{opacity:1;animation:rvIn 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--dd,0)*1ms)}
.rv.rv-l.in{animation-name:rvInL}
@keyframes rvIn{from{opacity:0;transform:translateY(46px) scale(.96);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes rvInL{from{opacity:0;transform:translateX(-80px) rotateY(18deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}

/* ====== EXTRA DEPTH ====== */
section{overflow:hidden}
section>.wrap{position:relative;z-index:1}
#projects::before,#skills::before,#contact::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;filter:blur(90px);pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
#projects::before{background:var(--vi);opacity:.26;left:-200px;top:8%}
#skills::before{background:var(--cy);opacity:.15;right:-220px;top:18%}
#contact::before{background:var(--mg);opacity:.13;left:30%;bottom:-240px}
@keyframes drift{to{transform:translate(90px,-70px) scale(1.18)}}
.glare{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(0,229,255,.22),transparent 46%)}
.card:hover .glare{opacity:1}
.card::before{z-index:4}.card::after{z-index:4}
.cover.fit{object-fit:contain;padding:14px;background:#05060A}
.cover.inv{filter:invert(.9) hue-rotate(185deg) saturate(1.3) brightness(1.05)}
.tl::after{content:"";position:absolute;left:11px;top:6px;width:2px;height:calc((100% - 12px)*var(--p,0));background:linear-gradient(var(--cy),var(--mg));box-shadow:0 0 12px var(--cy)}
.tl-item .dot{transition:transform .4s,background .4s}
.tl-item.act .dot{background:rgba(0,229,255,.25);transform:scale(1.15)}
.tl-item.act{border-color:rgba(0,229,255,.45)}
.logo i{animation:pulse 3s ease-in-out infinite}
.btn.solid{position:relative;overflow:hidden}
.btn.solid::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-70%}100%{left:130%}}
.stat b{text-shadow:0 0 18px rgba(0,229,255,.55)}
.hex{animation:hexfloat 4.5s ease-in-out infinite}
.cert:nth-child(2n) .hex{animation-delay:-1.5s}.cert:nth-child(3n) .hex{animation-delay:-3s}
@keyframes hexfloat{50%{transform:translateY(-4px) rotate(4deg)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}#boot{display:none}}
</style>

function applyLang(){
  document.documentElement.lang = lang;
  $$('[data-i18n]').forEach(e=>{ e.textContent = T[lang][e.dataset.i18n]; });
  $$('[data-i18n-html]').forEach(e=>{ e.innerHTML = T[lang][e.dataset.i18nHtml]; });
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.lang===lang));
  renderFilters(); renderProjects(); renderTimeline(); renderEdu(); renderSkillsList(); renderCerts(); renderAwards();
  if(CV_URL){ const b=$('#cvbtn'); b.hidden=false; b.href=CV_URL; }
}

/* ---------- hero role cycling + scramble ---------- */
let roleTimer, roleIdx=0;
function scramble(el,final,dur=520){
  if(reduce){el.textContent=final;return;}
  const chars='01<>/[]{}#$%*'; const start=performance.now();
  (function step(now){
    const p=Math.min(1,(now-start)/dur);
    el.textContent=[...final].map((c,i)=>c===' '?' ':(i<p*final.length?c:chars[Math.random()*chars.length|0])).join('');
    if(p<1) requestAnimationFrame(step); else el.textContent=final;
  })(start);
}
function startRole(){
  clearInterval(roleTimer); roleIdx=0;
  const el=$('#role'); el.textContent=ROLES[lang][0];
  if(reduce) return;
  roleTimer=setInterval(()=>{ roleIdx=(roleIdx+1)%3; scramble(el,ROLES[lang][roleIdx]); },2800);
}

    dring.rotation.y=s*.5; dcubes.forEach(c=>{ c.position.set(Math.cos(c.userData.a)*3.4,Math.sin(s*1.4+c.userData.h)*.5,Math.sin(c.userData.a)*3.4); c.rotation.x=s; c.rotation.y=s*.7; });
    beam.position.z=((s*2.2)%24)-12; beam.material.opacity=.14+.08*Math.sin(s*3);
    { const a=s*.22, R=9; plane.position.set(Math.cos(a)*R,5.6+Math.sin(s*.7)*.4,Math.sin(a)*5.5-2); plane.rotation.y=Math.atan2(-Math.cos(a)*5.5,-Math.sin(a)*R); plane.rotation.x=Math.sin(s*.9)*.12; plane.rotation.z=.18; }
    { const pa=pg.attributes.position.array; for(let i=0;i<N;i++){ pa[i*3+1]+=.004+(i%7)*.0006; if(pa[i*3+1]>9) pa[i*3+1]=0; } pg.attributes.position.needsUpdate=true; }
    hs.position.y=4.9+Math.sin(s*.9)*.2; hs.rotation.y=Math.sin(s*.5)*.55+m.x*.35; hs.rotation.x=m.y*.15;
    panels.forEach((p,i)=>{ p[0].position.y=p[2]+Math.sin(s*.8+i*1.7)*.12; p[0].rotation.y=p[4]+m.x*.18; });
    crates.forEach((c,i)=>{ c.position.x=((-4.5+i*2.6+s*.9+5.2)%10.4)-5.2; c.rotation.y=Math.sin(s+i)*.1; });
    pts.rotation.y=s*.02+m.x*.08; pts.position.y=Math.sin(s*.3)*.2+m.y*.15;
    renderer.render(scene,camera);
  }
  if(reduce){ draw(1500); }
  else renderer.setAnimationLoop(t=>{ if(visible||renderer.xr.isPresenting) draw(t); });

  // WebXR
  const vrbtn=$('#vrbtn');
  if(navigator.xr){ navigator.xr.isSessionSupported('immersive-vr').then(ok=>{ if(ok) vrbtn.hidden=false; }).catch(()=>{}); }
  vrbtn.addEventListener('click',async()=>{
    try{
      const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
      world.position.set(0,-1.2,-6); world.scale.setScalar(.8);
      renderer.xr.setSession(s);
      s.addEventListener('end',()=>{ world.position.set(innerWidth>900?1.6:0,0,0); world.scale.setScalar(1); layout(); });
    }catch(e){ console.warn('XR session failed',e); }
  });
})();

/* ---------- SKILL ORBIT (2D constellation) ---------- */
(function(){
  const cv=$('#orbit'), ctx=cv.getContext('2d'); let W=0,H=0,t=0,hover=-1,mx=-999,my=-999,vis=false;
  const nodes=[];
  function size(){ const r=cv.getBoundingClientRect(); const d=Math.min(devicePixelRatio||1,2); W=r.width;H=r.height; cv.width=W*d;cv.height=H*d; ctx.setTransform(d,0,0,d,0,0); if(reduce||!vis) frame(); }
  function frame(){
    ctx.clearRect(0,0,W,H);
    const cx=W/2, cy=H/2, R=Math.min(W,H)*.3, n=SKILLS.length;
    nodes.length=0;
    // rings
    ctx.strokeStyle='rgba(0,229,255,.12)'; ctx.lineWidth=1;
    [R*.55,R,R*1.55].forEach(r=>{ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();});
    SKILLS.forEach((g,i)=>{
      const a=i/n*Math.PI*2-Math.PI/2+t*.06, gx=cx+Math.cos(a)*R, gy=cy+Math.sin(a)*R*.92;
      const dim = hover>=0 && hover!==i;
      ctx.globalAlpha = dim?.18:1;
      ctx.strokeStyle=g.c; ctx.lineWidth=1; ctx.globalAlpha*=.35; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(gx,gy); ctx.stroke(); ctx.globalAlpha = dim?.18:1;
      g.s.forEach((s,j)=>{
        const rr=Math.min(W,H)*.15+(j%2)*Math.min(W,H)*.045, b=j/g.s.length*Math.PI*2+t*(i%2?.35:-.35)+i, sx=gx+Math.cos(b)*rr*1.25, sy=gy+Math.sin(b)*rr;
        ctx.strokeStyle=g.c; ctx.globalAlpha*=.3; ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(sx,sy); ctx.stroke(); ctx.globalAlpha = dim?.18:1;
        ctx.fillStyle=g.c; ctx.beginPath(); ctx.arc(sx,sy,3,0,7); ctx.fill();
        ctx.fillStyle='#DDE3F2'; ctx.font='500 11.5px Inter, system-ui, sans-serif'; ctx.textAlign = sx>=gx?'left':'right'; ctx.textBaseline='middle';
        ctx.fillText(s, sx+(sx>=gx?7:-7), sy);
        nodes.push({i,x:sx,y:sy});
      });
      ctx.shadowColor=g.c; ctx.shadowBlur=18; ctx.fillStyle=g.c; ctx.beginPath(); ctx.arc(gx,gy,8,0,7); ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle='#fff'; ctx.font='600 13px "Space Grotesk", system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText(L(g.n), gx, gy-13);
      nodes.push({i,x:gx,y:gy});
    });
    ctx.globalAlpha=1;
    // core
    ctx.shadowColor='#00E5FF'; ctx.shadowBlur=26; ctx.strokeStyle='#00E5FF'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,24,0,7); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle='#00E5FF'; ctx.font='700 14px "Space Grotesk", system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('RH',cx,cy+1);
  }
  function loop(){ if(vis){ t+=.012; frame(); } requestAnimationFrame(loop); }
  cv.addEventListener('pointermove',e=>{ const r=cv.getBoundingClientRect(); mx=e.clientX-r.left; my=e.clientY-r.top; let best=-1,bd=900; nodes.forEach(n=>{const d=(n.x-mx)**2+(n.y-my)**2; if(d<bd){bd=d;best=n.i;}}); hover=best; });
  cv.addEventListener('pointerleave',()=>{hover=-1;});
  new IntersectionObserver(es=>{vis=es[0].isIntersecting;}).observe(cv);
  addEventListener('resize',size); size();
  if(!reduce) loop();
})();

/* ---------- icon strip ---------- */
ICONS.car='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 40v-8l7-3 8-11h22l9 11 7 3v8z"/><path d="M21 18l-6 11h34l-6-11"/><circle cx="19" cy="42" r="6" fill="#0a0d18"/><circle cx="45" cy="42" r="6" fill="#0a0d18"/></svg>';
ICONS.plane='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M58 8 8 30l16 6 6 18 6-12 10 6z"/><path d="M24 36 58 8"/></svg>';
(function(){
  const items=[['VR','VR'],['car','Automotive'],['AR','AR'],['Industry','Industry 4.0'],['plane','Aerospace'],['Embedded','Embedded'],['AI','AI & CNN']];

/* ---------- reveal, scroll effects, side nav ---------- */
const rio=new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting) return; const el=en.target; rio.unobserve(el);
  el.style.setProperty('--dd',(+el.dataset.d||0)); el.classList.add('in');
}),{threshold:.1,rootMargin:'0px 0px -5% 0px'});
function reveal(root=document){
  $$('.rv:not(.in)',root).forEach(el=>{ if(el.dataset.d===undefined){ el.dataset.d=([...el.parentElement.children].indexOf(el)%6)*90; } rio.observe(el); });
}
function initScrollFx(){
  const prog=$('#prog'), tl=$('#tl'), links=$$('#sidenav a');
  function onScroll(){
    const h=document.documentElement.scrollHeight-innerHeight;
    prog.style.transform=`scaleX(${h>0?Math.min(1,scrollY/h):0})`;
    const r=tl.getBoundingClientRect(); tl.style.setProperty('--p',Math.max(0,Math.min(1,(innerHeight*.65-r.top)/r.height)));
    $$('.tl-item',tl).forEach(it=>it.classList.toggle('act',it.getBoundingClientRect().top<innerHeight*.65));
  }
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  const so=new IntersectionObserver(es=>es.forEach(en=>{ if(en.isIntersecting){ links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id)); } }),{rootMargin:'-45% 0px -50% 0px'});
  ['hero','about','projects','experience','education','skills','certs','awards','contact'].forEach(id=>{ const e=document.getElementById(id); if(e) so.observe(e); });
}
function splitName(){
  const h=$('#name'); h.setAttribute('aria-label','Reda Haddar'); let i=0;
  $$('span',h).forEach((sp,ln)=>{
    const txt=sp.textContent; sp.textContent=''; sp.setAttribute('aria-hidden','true');
    [...txt].forEach((c,k)=>{ const s=document.createElement('i'); s.className='ch'; s.textContent=c; s.style.setProperty('--i',i++);
      if(ln===1){ const m=k/((txt.length-1)||1); s.style.color=`rgb(${Math.round(124*m)},${Math.round(229-171*m)},${Math.round(255-18*m)})`; }
      sp.appendChild(s); });
  });
}
function clock(){
  const el=$('#clk'); const f=()=>{ try{ el.textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Casablanca',hour12:false}); }catch(e){} };
  f(); setInterval(f,1000);
}
function boot(){
  const b=$('#boot'); const go=()=>{ document.body.classList.add('ready'); window.__ready=performance.now(); };
  if(reduce){ go(); b.remove(); return; }
  const msgs=lang==='fr'?['Initialisation du jumeau numérique','Chargement de la scène 3D','Calibrage XR','Prêt']:['Initialising digital twin','Loading 3D scene','Calibrating XR','Ready'];
  const bar=$('#bootbar'), txt=$('#boottxt'); let p=0; txt.textContent=msgs[0];
  const id=setInterval(()=>{
    p+=Math.random()*13+6;
    if(p>=100){ clearInterval(id); bar.style.width='100%'; txt.textContent=msgs[3]; setTimeout(()=>{ b.classList.add('out'); go(); setTimeout(()=>b.remove(),1100); },380); return; }
    bar.style.width=p+'%'; txt.textContent=msgs[Math.min(2,Math.floor(p/34))];
  },130);
}

/* ---------- init ---------- */
splitName(); applyLang(); startRole(); observeAll(); initScrollFx(); clock(); boot(); reveal();
</script>
